[tasks.bootstrap]
run = '''
#!/usr/bin/env bun

import { $ } from "bun"
import path from "node:path"
import os from "node:os"

const COMMANDS = [
  ['bun', path.resolve(os.homedir(), '.dotfiles/__scripts__/clash-verge-rev/patch_config.yaml.ts')],
  ['bun', path.resolve(os.homedir(), '.dotfiles/__scripts__/clash-verge-rev/patch_verge.yaml.ts')],
  ['bun', path.resolve(os.homedir(), '.dotfiles/__scripts__/windows-terminal/patch_settings.json.ts')],
  ['bun', path.resolve(os.homedir(), '.dotfiles/__scripts__/windows-terminal-preview/patch_settings.json.ts')],
{% if os() == "windows" %}
  ['cmd', '/c', path.resolve(os.homedir(), '.dotfiles/__scripts__/disable_ctrl_space.cmd')],
  ['cmd', '/c', path.resolve(os.homedir(), '.dotfiles/__scripts__/set_cc_cxx.cmd')],
  ['cmd', '/c', path.resolve(os.homedir(), '.dotfiles/__scripts__/set_yazi_file_one.cmd')],
  ['cmd', '/c', path.resolve(os.homedir(), '.local/bin/set_cjk-font-fallback.cmd')],
{% endif %}
]

for (const CMD of COMMANDS) {
  await $`${CMD}`
}
'''
